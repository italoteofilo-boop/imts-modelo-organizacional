<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal · IMTS.OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fonte-base" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comum/base.css">
<style>
/* Layout: faixa da marca da empresa (cor vem da marca da contraparte), abas do que a organização acompanha, painel lateral para novo pedido. */
:root {
  --chao:#EEF0F2; --folha:#FFFFFF; --tinta:#16202A; --apoio:#56616C; --fio:#D5DAE0; --marca:#2E4A66; --marca-tinta:#FFFFFF;
  --realce:#2E4A66; --realce-suave:#E3EAF2; --bom:#1D6B47; --bom-suave:#DCEFE4; --espera:#8A5A00; --espera-suave:#F6EBD3; --mal:#A8321E; --mal-suave:#F7E1DC;
  --sombra:0 1px 2px rgba(10,20,30,.06), 0 4px 14px rgba(10,20,30,.06);
  --texto:'Atkinson Hyperlegible', system-ui, sans-serif; --titulo:'Fraunces', Georgia, serif; --dados:ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --chao:#11161B; --folha:#1A2129; --tinta:#E8ECF0; --apoio:#9EA9B4; --fio:#2C3640; --realce:#9DB9D6; --realce-suave:#22303E;
  --bom:#7CD3A0; --bom-suave:#1C3326; --espera:#E8C276; --espera-suave:#3A3020; --mal:#F2948A; --mal-suave:#3A2420; --sombra:0 1px 2px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --chao:#11161B; --folha:#1A2129; --tinta:#E8ECF0; --apoio:#9EA9B4; --fio:#2C3640; --realce:#9DB9D6; --realce-suave:#22303E;
  --bom:#7CD3A0; --bom-suave:#1C3326; --espera:#E8C276; --espera-suave:#3A3020; --mal:#F2948A; --mal-suave:#3A2420; --sombra:0 1px 2px rgba(0,0,0,.4); color-scheme: dark; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { background:var(--chao); }
body { margin:0; color:var(--tinta); font-family:var(--texto); font-size:15px; line-height:1.45; }
button, select, input, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--realce); outline-offset:2px; }
.faixa-marca { background:var(--marca); color:var(--marca-tinta); padding-block:18px 20px; padding-inline:max(16px, 4vw); display:flex; flex-wrap:wrap; gap:12px 20px; align-items:end; }
.faixa-marca .quem-somos { margin-right:auto; min-width:0; }
.faixa-marca .empresa { font-size:13px; letter-spacing:.08em; text-transform:uppercase; opacity:.85; }
.faixa-marca h1 { font-family:var(--titulo); font-weight:600; font-size:clamp(22px, 3.2vw, 30px); line-height:1.15; margin:4px 0 0; text-wrap:balance; }
.faixa-marca .org { font-size:14px; opacity:.9; margin-top:4px; overflow-wrap:anywhere; }
.casca { padding-block:16px 40px; padding-inline:max(16px, 4vw); display:flex; flex-direction:column; gap:16px; max-width:1100px; }
.barra { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.aba { border:1px solid var(--fio); background:var(--folha); border-radius:99px; padding:7px 15px; font-size:14px; }
.aba[aria-selected="true"] { background:var(--tinta); color:var(--chao); border-color:var(--tinta); }
.aba .n { font-size:12px; opacity:.75; margin-left:4px; font-variant-numeric:tabular-nums; }
.btn { border:1px solid var(--fio); background:var(--folha); border-radius:10px; padding:8px 14px; font-size:14px; }
.btn.prim { background:var(--marca); border-color:var(--marca); color:var(--marca-tinta); }
.btn.perigo { border-color:var(--mal); color:var(--mal); }
.btn:disabled { opacity:.45; cursor:not-allowed; }
#b-telegram { margin-left:auto; }
.lista { display:flex; flex-direction:column; gap:10px; }
.item { background:var(--folha); border:1px solid var(--fio); border-radius:12px; padding:14px 16px; display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:6px 16px; align-items:start; }
.item .t { font-weight:700; overflow-wrap:anywhere; }
.item .sub { font-size:13px; color:var(--apoio); overflow-wrap:anywhere; }
.item .lado { display:flex; flex-direction:column; gap:6px; align-items:end; }
.chip { font-size:12px; padding:2px 9px; border-radius:99px; background:var(--chao); color:var(--apoio); white-space:nowrap; }
.chip.bom { background:var(--bom-suave); color:var(--bom); } .chip.espera { background:var(--espera-suave); color:var(--espera); } .chip.mal { background:var(--mal-suave); color:var(--mal); }
.chip.realce { background:var(--realce-suave); color:var(--realce); }
.linha-tempo { grid-column:1 / -1; margin:6px 0 0; padding:0 0 0 14px; border-left:2px solid var(--fio); list-style:none; display:flex; flex-direction:column; gap:8px; }
.linha-tempo li { position:relative; font-size:14px; }
.linha-tempo li::before { content:''; position:absolute; left:-20px; top:6px; width:10px; height:10px; border-radius:50%; background:var(--folha); border:2px solid var(--realce); }
.linha-tempo li:last-child::before { background:var(--realce); }
.linha-tempo .q { font-size:12px; color:var(--apoio); font-variant-numeric:tabular-nums; }
details > summary { cursor:pointer; font-size:13px; color:var(--realce); min-height:24px; padding-block:4px; }
.acoes { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.acoes select { padding:6px 8px; border:1px solid var(--fio); border-radius:8px; background:var(--folha); color:var(--tinta); }
.cod { font-family:var(--dados); font-size:12px; overflow-wrap:anywhere; }
.vazio { background:var(--folha); border:1px dashed var(--fio); border-radius:12px; padding:16px; color:var(--apoio); font-size:14px; margin:0; }
.resposta { grid-column:1 / -1; background:var(--chao); border-radius:8px; padding:8px 10px; font-size:14px; overflow-wrap:anywhere; }
.resposta.aviso { background:var(--espera-suave); color:var(--espera); }
.painel { position:fixed; inset:0 0 0 auto; width:min(460px, 100%); background:var(--folha); border-left:1px solid var(--fio); box-shadow:-8px 0 24px rgba(0,0,0,.16);
  padding:18px 20px calc(18px + env(safe-area-inset-bottom, 0px)); overflow-y:auto; display:flex; flex-direction:column; gap:14px; z-index:5; }
.painel h2 { font-family:var(--titulo); font-weight:600; font-size:22px; line-height:1.2; margin:0; text-wrap:balance; }
.painel .topo { display:flex; justify-content:space-between; gap:12px; align-items:start; }
.painel p { margin:0; font-size:14px; color:var(--apoio); }
.campo { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--apoio); }
.campo input, .campo select, .campo textarea { padding:9px 10px; border:1px solid var(--fio); border-radius:8px; background:var(--folha); color:var(--tinta); font-size:15px; min-width:0; }
.campo textarea { min-height:110px; resize:vertical; }
.recibos { position:fixed; left:16px; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; gap:6px; z-index:6; max-width:min(440px, calc(100% - 32px)); }
.recibo { background:var(--folha); border:1px solid var(--fio); border-left:4px solid var(--realce); border-radius:10px; padding:8px 12px; font-size:13px; box-shadow:var(--sombra); }
.recibo.feito { border-left-color:var(--bom); } .recibo.recusado { border-left-color:var(--mal); }
.rodape { font-size:12px; color:var(--apoio); max-width:75ch; margin:0; }
.totais { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:8px; }
.total { background:var(--folha); border:1px solid var(--fio); border-radius:12px; padding:10px 14px; }
.total .v { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; } .total .r { font-size:13px; color:var(--apoio); }
.sala { grid-column:1 / -1; display:flex; flex-direction:column; gap:6px; background:var(--chao); border-radius:10px; padding:10px; max-height:280px; overflow:auto; }
.msg { max-width:85%; padding:6px 10px; border-radius:10px; font-size:14px; background:var(--folha); border:1px solid var(--fio); overflow-wrap:anywhere; }
.msg.parceiro { align-self:end; background:var(--realce-suave); border-color:transparent; } .msg.sistema { align-self:center; font-size:12px; color:var(--apoio); background:transparent; border-style:dashed; }
.msg .q { font-size:11px; color:var(--apoio); }
.form-linha { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:8px; }
.form-linha input[type="text"] { flex:1 1 240px; min-width:0; padding:8px 10px; border:1px solid var(--fio); border-radius:8px; background:var(--folha); color:var(--tinta); }
.conf { grid-column:1 / -1; margin:0; padding-left:18px; font-size:13px; } .conf .ok { color:var(--bom); } .conf .nao { color:var(--mal); }
.escolha { display:flex; flex-direction:column; gap:6px; max-height:220px; overflow:auto; }
.escolha label { display:flex; gap:8px; align-items:center; font-size:14px; background:var(--chao); border-radius:8px; padding:8px 10px; color:var(--tinta); }
.codigo { font-family:var(--dados); font-size:26px; letter-spacing:.12em; background:var(--chao); border-radius:10px; padding:12px; text-align:center; overflow-wrap:anywhere; }
.tabela { width:100%; border-collapse:collapse; font-size:14px; }
.tabela th, .tabela td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--fio); vertical-align:top; }
.tabela th { font-size:12px; color:var(--apoio); } .tabela td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.rolar { grid-column:1 / -1; overflow-x:auto; }
.valor { font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
.erro-carga { background:var(--mal-suave); color:var(--mal); border-radius:12px; padding:14px 16px; margin:0; }
@media (max-width: 640px) { .item { grid-template-columns:minmax(0, 1fr); } .item .lado { align-items:start; flex-direction:row; flex-wrap:wrap; } #b-telegram { margin-left:0; } }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<header id="imts-barra"></header>
<div class="faixa-marca" id="faixa">
  <div class="quem-somos">
    <div class="empresa" id="empresa">Ecossistema IMTS</div>
    <h1 id="titulo">Portal</h1>
    <div class="org" id="org"></div>
  </div>
</div>

<main class="casca">
  <div class="barra">
    <div role="tablist" aria-label="O que você acompanha" style="display:contents">
      <button class="aba" role="tab" id="t-andamentos" data-aba="andamentos" aria-controls="conteudo" aria-selected="true" tabindex="0">Andamentos<span class="n" id="n-andamentos"></span></button>
      <button class="aba" role="tab" id="t-documentos" data-aba="documentos" aria-controls="conteudo" aria-selected="false" tabindex="-1">Documentos<span class="n" id="n-documentos"></span></button>
      <button class="aba" role="tab" id="t-notas" data-aba="notas" aria-controls="conteudo" aria-selected="false" tabindex="-1">Notas de débito<span class="n" id="n-notas"></span></button>
      <button class="aba" role="tab" id="t-reunioes" data-aba="reunioes" aria-controls="conteudo" aria-selected="false" tabindex="-1">Reuniões<span class="n" id="n-reunioes"></span></button>
      <button class="aba" role="tab" id="t-pedidos" data-aba="pedidos" aria-controls="conteudo" aria-selected="false" tabindex="-1">Pedidos<span class="n" id="n-pedidos"></span></button>
      <button class="aba" role="tab" id="t-oportunidades" data-aba="oportunidades" aria-controls="conteudo" aria-selected="false" tabindex="-1" hidden>Oportunidades<span class="n" id="n-oportunidades"></span></button>
      <button class="aba" role="tab" id="t-carteira" data-aba="carteira" aria-controls="conteudo" aria-selected="false" tabindex="-1" hidden>Comissões<span class="n" id="n-carteira"></span></button>
      <button class="aba" role="tab" id="t-prestacao" data-aba="prestacao" aria-controls="conteudo" aria-selected="false" tabindex="-1" hidden>Prestação de contas<span class="n" id="n-prestacao"></span></button>
    </div>
    <button class="btn" id="b-telegram" type="button" disabled>Telegram</button>
    <button class="btn prim" id="b-novo" type="button" disabled>Novo pedido</button>
  </div>
  <section id="conteudo" role="tabpanel" tabindex="0" aria-labelledby="t-andamentos"><p class="vazio">Carregando o portal…</p></section>
  <p class="rodape" id="rodape"></p>
</main>
<aside class="painel" id="painel" hidden role="dialog" aria-modal="true" aria-labelledby="p-titulo"></aside>
<div class="recibos" id="recibos" aria-live="polite"></div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="comum/imts.js"></script>
<script>
(async function () {
const $ = id => document.getElementById(id);
const esc = s => IMTS.esc(s);
const quando = t => t ? new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const dia = t => t ? new Date(t + (String(t).length === 10 ? 'T12:00:00' : '')).toLocaleDateString('pt-BR') : '';
const num = v => Number.isFinite(Number(v)) ? Number(v) : 0;
const TIPO = { chamado: 'Chamado', duvida: 'Dúvida', titular: 'Pedido de titular de dados (LGPD)', adesao: 'Adesão à ata de registro de preços',
  oportunidade: 'Registro de oportunidade', aceite: 'Aceite de entrega', devolucao: 'Devolução de entrega', reclamacao: 'Reclamação', os: 'Ordem de serviço', ouvidoria: 'Ouvidoria' };
const AJUDA = { chamado: 'Algo não funciona como deveria ou precisa de atendimento. O prazo de resposta aparece no acompanhamento.', duvida: 'Pergunta sobre o contrato, o serviço ou o portal. O prazo de resposta aparece no acompanhamento.',
  titular: 'Direitos sobre os seus dados pessoais. Confirmação e acesso: até 15 dias (Lei 13.709/2018, art. 19, II). Os demais direitos seguem o prazo informado no acompanhamento.', adesao: 'Pedido para aderir à ata de registro de preços vigente.',
  oportunidade: 'Registre o cliente final e o assunto. O registro aceito dá exclusividade pelo prazo definido pela empresa, mostrado na aba Oportunidades.',
  reclamacao: 'Algo saiu errado e você quer correção. A equipe registra os encaminhamentos com responsável e prazo; você acompanha cada um.',
  os: 'Pedido de execução de um serviço do contrato. Cada etapa vira um encaminhamento datado; ao final, você confirma o encerramento.',
  ouvidoria: 'Canal independente, conduzido pela Governança. Use quando o atendimento comum não resolveu ou para relatar conduta. Pode ser anônima: a equipe não vê quem escreveu.' };
const SIT = s => ({ prevista: 'realce', adquirida: 'espera', a_pagar: 'espera', paga: 'bom', enviada: 'realce', conferida: 'realce', divergente: 'mal', aprovada: 'bom', recusada: 'mal', recebido: 'espera', em_atendimento: 'realce', respondido: 'bom', encerrado: '', recusado: 'mal', registrada: 'realce', em_negociacao: 'espera', ganha: 'bom', perdida: 'mal', expirada: '' }[s] ?? '');
const brl = v => v == null ? '' : Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const SITC = { prevista: 'Prevista', adquirida: 'Adquirida', a_pagar: 'A pagar', paga: 'Paga' };
const REGRA = { comissoes: 'Comissões escolhidas', cnpj: 'CNPJ do emitente', numero: 'Número da nota', valor: 'Valor da nota' };
const PLAT = { meet: 'Google Meet', zoom: 'Zoom', teams: 'Microsoft Teams', webex: 'Webex', presencial: 'Presencial', outra: 'Outra' };
let dados = null, parc = null, reus = [], notas = null, notasErro = null, aba = 'andamentos', voltarFoco = null;

const motivo = e => e?.message || String(e || 'erro');
function recibo(tipo, texto) { const d = document.createElement('div'); d.className = 'recibo ' + tipo; d.textContent = texto; $('recibos').prepend(d); setTimeout(() => d.remove(), 8000); }

// quem é de fora: o login define cliente ou parceiro; quem é de dentro ou sem cadastro volta à entrada
const quem = await IMTS.iniciar({ exige: 'externo', modulo: 'portal', admin: false });

// ---------- marca da empresa ----------
function contraste(hex) { const h = (hex || '').replace('#', ''); if (h.length !== 6) return '#FFFFFF';
  const [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(c => c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4);
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 0.4 ? '#16202A' : '#FFFFFF'; }
const FONTES_OK = /^[A-Za-z0-9 ]{2,40}$/;
function aplicarMarca(m) {
  const raiz = document.documentElement.style;
  const cor = m?.cores?.primaria;
  if (cor && /^#[0-9A-Fa-f]{6}$/.test(cor)) { raiz.setProperty('--marca', cor); raiz.setProperty('--marca-tinta', contraste(cor)); }
  else { raiz.removeProperty('--marca'); raiz.removeProperty('--marca-tinta'); }
  const f = m?.tipografia?.texto, d = m?.tipografia?.display;
  const familias = [...new Set([f, d].filter(x => x && FONTES_OK.test(x)))];
  if (familias.length) {
    let l = document.getElementById('fonte-marca');
    if (!l) { l = document.createElement('link'); l.id = 'fonte-marca'; l.rel = 'stylesheet'; document.head.appendChild(l); }
    l.href = 'https://fonts.googleapis.com/css2?' + familias.map(x => 'family=' + x.replace(/ /g, '+') + ':wght@400;600;700').join('&') + '&display=swap';
    raiz.setProperty('--texto', `'${f || d}', 'Atkinson Hyperlegible', system-ui, sans-serif`);
    raiz.setProperty('--titulo', `'${d || f}', 'Fraunces', Georgia, serif`);
  } else { raiz.removeProperty('--texto'); raiz.removeProperty('--titulo'); }
}

// ---------- visões ----------
function vAndamentos() {
  const as = dados.andamentos || [];
  if (!as.length) return '<p class="vazio">Nada em andamento para o seu perfil. Quando um processo seu avançar, a etapa aparece aqui com data e próxima ação.</p>';
  return `<div class="lista">${as.map(a => {
    const aguarda = a.acao === 'aceite' && !a.concluido && !a.aceite;
    const estadoChip = a.concluido ? '<span class="chip bom">concluído</span>' : aguarda ? '<span class="chip espera">aguardando você</span>' : '<span class="chip realce">em andamento</span>';
    const linha = a.linha || [];
    return `<article class="item">
      <div><div class="t">${esc(a.assunto || a.jornada)}</div><div class="sub">${esc(a.estado)} · referência ${esc(a.ref)}</div></div>
      <div class="lado">${estadoChip}<span class="sub">${quando(a.atualizado)}</span></div>
      ${a.aceite ? `<div class="resposta">${a.aceite.tipo === 'aceite' ? 'Aceite registrado' : 'Devolução registrada'} em ${quando(a.aceite.em)} · ${esc((a.aceite.situacao || '').replace(/_/g, ' '))}</div>` : ''}
      ${aguarda && dados.pode?.aceite ? `<div class="acoes"><button class="btn prim" type="button" data-aceite="${esc(a.ref)}" data-t="aceite">Aceitar a entrega</button><button class="btn perigo" type="button" data-aceite="${esc(a.ref)}" data-t="devolucao">Devolver com motivo</button></div>` : ''}
      <details style="grid-column:1 / -1"><summary>Linha do tempo (${linha.length} ${linha.length === 1 ? 'etapa' : 'etapas'})</summary>
        <ol class="linha-tempo">${linha.map(l => `<li><div>${esc(l.estado)}</div><div class="sub">${esc(l.mensagem)}</div><div class="q">${quando(l.em)}</div></li>`).join('')}</ol></details>
    </article>`; }).join('')}</div>`;
}
function vDocumentos() {
  const ds = dados.documentos || [];
  if (!ds.length) return '<p class="vazio">Nenhum documento publicado para o seu perfil. Só chegam aqui documentos aprovados em duas etapas (análise crítica e aprovação) pela empresa.</p>';
  return `<div class="lista">${ds.map(d => `<article class="item">
      <div><div class="t">${esc(d.titulo)}</div><div class="sub">${esc(d.tipo)} · ${num(d.paginas)} ${num(d.paginas) === 1 ? 'página' : 'páginas'} · publicado em ${quando(d.publicado_em)}</div>
        <div class="sub">Impressão digital SHA-256: <span class="cod">${esc(String(d.hash ?? '').slice(0, 16))}…</span></div></div>
      <div class="lado"><button class="btn" type="button" data-baixar="${esc(d.emissao)}" data-nome="${esc(d.titulo)}">Baixar PDF</button></div>
    </article>`).join('')}</div>`;
}
function vNotas() {
  if (!notas) return `<p class="erro-carga" role="alert">As notas de débito não carregaram${notasErro ? ': ' + esc(notasErro) : ''}. O resto do portal segue funcionando.</p>`;
  if (!notas.length) return '<p class="vazio">Nenhuma nota de débito publicada para a sua organização. A nota de débito cobra o reembolso de despesas que a empresa pagou por conta de vocês (viagem, taxas, cópias); não é documento fiscal.</p>';
  const rot = n => n.situacao === 'paga' ? ['bom', 'paga em ' + dia(n.pago_em)] : n.situacao === 'cancelada' ? ['', 'cancelada'] : n.vencida ? ['mal', 'vencida'] : ['espera', 'em aberto'];
  return `<div class="lista">${notas.map(n => { const [c, r] = rot(n), itens = n.itens || [];
    return `<article class="item" data-nd="${esc(n.id)}">

function desenhar() {

  if (!dados) return;
  const c = dados.contraparte || {};
  aplicarMarca(c.marca);
  const parceiro = (quem.contraparte?.tipo || c.tipo) === 'parceiro';
  $('empresa').textContent = c.marca?.nome || c.empresa || 'Ecossistema IMTS';
  $('titulo').textContent = parceiro ? 'Portal do parceiro' : 'Portal do cliente';
  $('org').textContent = `${c.nome || quem.contraparte?.nome || ''} · ${dados.eu?.nome || quem.nome || ''} (perfil ${dados.eu?.perfil || quem.perfil || ''})`;
  $('t-oportunidades').hidden = !dados.pode?.oportunidade;
  $('t-carteira').hidden = !parc?.pode?.carteira; $('t-prestacao').hidden = !parc?.pode?.prestacao;
  if ((aba === 'oportunidades' && !dados.pode?.oportunidade) || (aba === 'carteira' && !parc?.pode?.carteira) || (aba === 'prestacao' && !parc?.pode?.prestacao)) { aba = 'andamentos'; return desenhar(); }
  $('n-carteira').textContent = (parc?.carteira?.itens || []).filter(i => i.situacao === 'adquirida' && !i.prestacao).length || '';
  $('n-prestacao').textContent = (parc?.prestacoes || []).filter(p => ['divergente', 'recusada'].includes(p.situacao)).length || '';
  $('n-andamentos').textContent = (dados.andamentos || []).length || '';
  $('n-documentos').textContent = (dados.documentos || []).length || '';
  $('n-notas').textContent = (notas || []).filter(n => n.situacao === 'emitida').length || '';
  $('n-pedidos').textContent = (dados.pedidos || []).length || ''; $('n-reunioes').textContent = reus.filter(r => r.situacao === 'agendada').length || '';

  $('conteudo').innerHTML = { andamentos: vAndamentos, documentos: vDocumentos, notas: vNotas, pedidos: vPedidos, oportunidades: vOportunidades, reunioes: vReunioes, carteira: vCarteira, prestacao: vPrestacao }[aba]();
  $('b-novo').disabled = false; $('b-telegram').disabled = false;
  $('rodape').textContent = 'Você vê só o que foi publicado para a sua organização e o seu perfil. Mudanças internas da empresa não aparecem aqui; cada etapa visível tem título e texto aprovados para o público externo.';
}

// ---------- ações ----------
function fechar() { $('painel').hidden = true; $('painel').innerHTML = ''; if (voltarFoco && document.contains(voltarFoco)) voltarFoco.focus(); voltarFoco = null; }
function abrirPainel(html) { $('painel').innerHTML = html; $('painel').hidden = false; const f = $('painel').querySelector('select,input,textarea'); (f || $('painel')).focus(); $('p-fechar').onclick = fechar; const c = $('p-cancelar'); if (c) c.onclick = fechar; }
function tiposPermitidos() { const p = dados.pode || {}; return ['chamado', 'duvida'].concat(p.reclamacao ? ['reclamacao'] : [], p.os ? ['os'] : [], p.titular === false ? [] : ['titular'], p.ouvidoria ? ['ouvidoria'] : [], p.adesao ? ['adesao'] : [], p.oportunidade ? ['oportunidade'] : []); }
function abrirNovo() {

    <p>Quem recebe o pedido é a área responsável na empresa; o prazo aparece no acompanhamento.</p>
    <form id="f-novo" style="display:flex;flex-direction:column;gap:12px">
      <label class="campo" for="f-tipo">Tipo<select id="f-tipo">${ts.map(t => `<option value="${t}">${esc(TIPO[t])}</option>`).join('')}</select></label>
      <p id="f-ajuda"></p>
      <label id="l-anonimo" hidden style="gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="f-anonimo"> Enviar anônima (a equipe não verá o seu nome nem a sua organização)</label>
      <label class="campo" for="f-cliente" id="l-cliente" hidden>Cliente final<input id="f-cliente" maxlength="200" placeholder="nome do órgão ou da empresa"></label>
      <label class="campo" for="f-assunto">Assunto<input id="f-assunto" maxlength="200" required></label>
      <label class="campo" for="f-ref" id="l-ref">Referência (opcional)<select id="f-ref"><option value="">nenhuma</option>${(dados.andamentos || []).map(a => `<option value="${esc(a.ref)}">${esc(a.assunto || a.jornada)} · ${esc(a.ref)}</option>`).join('')}</select></label>
      <label class="campo" for="f-texto">Descrição<textarea id="f-texto" maxlength="4000" required></textarea></label>
      <div class="acoes"><button class="btn prim" type="submit">Enviar pedido</button><button class="btn" type="button" id="p-cancelar">Cancelar</button></div></form>`);
  const ajusta = () => { const t = $('f-tipo').value; $('f-ajuda').textContent = AJUDA[t] || ''; $('l-cliente').hidden = t !== 'oportunidade'; $('f-cliente').required = t === 'oportunidade';
    $('l-anonimo').hidden = t !== 'ouvidoria'; $('l-anonimo').style.display = t === 'ouvidoria' ? 'flex' : ''; $('l-ref').hidden = t === 'ouvidoria'; };
  $('f-tipo').onchange = ajusta; ajusta();
  $('f-novo').onsubmit = ev => { ev.preventDefault(); enviar($('f-tipo').value, $('f-assunto').value.trim(), $('f-texto').value.trim(), $('f-ref').value || null, $('f-cliente').value.trim() || null, $('f-anonimo').checked); };
}
function abrirAceite(ref, tipo) {
  const a = (dados.andamentos || []).find(x => String(x.ref) === String(ref)); if (!a) return;
  const devolve = tipo === 'devolucao';
  abrirPainel(`<div class="topo"><h2 id="p-titulo">${devolve ? 'Devolver a entrega' : 'Aceitar a entrega'}</h2><button class="btn" type="button" id="p-fechar">Fechar</button></div>
    <p>${esc(a.assunto)} · referência ${esc(a.ref)}. ${devolve ? 'Diga o que precisa ser corrigido; a equipe responde no prazo.' : 'O aceite fica registrado com data e o seu perfil.'}</p>
    <form id="f-ac" style="display:flex;flex-direction:column;gap:12px">
      <label class="campo" for="f-obs">${devolve ? 'Motivo da devolução' : 'Observação (opcional)'}<textarea id="f-obs" maxlength="4000" ${devolve ? 'required' : ''}></textarea></label>
      <div class="acoes"><button class="btn ${devolve ? 'perigo' : 'prim'}" type="submit">${devolve ? 'Devolver' : 'Registrar aceite'}</button><button class="btn" type="button" id="p-cancelar">Cancelar</button></div></form>`);
  $('f-ac').onsubmit = ev => { ev.preventDefault();
    enviar(tipo, (devolve ? 'Devolução: ' : 'Aceite: ') + (a.assunto || a.jornada), $('f-obs').value.trim() || 'Aceite sem observações.', a.ref, null); };

async function enviar(tipo, assunto, texto, ref, cliente, anonimo) {
  const b = $('painel').querySelector('button[type="submit"]'); if (b) b.disabled = true;
  try {
    const id = tipo === 'ouvidoria'
      ? await IMTS.chamar('ext.ouvidoria', { p_assunto: assunto, p_texto: texto, p_anonimo: !!anonimo })
      : await IMTS.chamar('ext.pedir', { p_tipo: tipo, p_assunto: assunto, p_texto: texto, p_instancia: ref ? Number(ref) : null, p_cliente_final: cliente || null });
    recibo('feito', `Pedido nº ${id} registrado (${TIPO[tipo].toLowerCase()}). Acompanhe na aba Pedidos.`);
    fechar(); await carregar(); if (!['aceite', 'devolucao'].includes(tipo)) { aba = tipo === 'oportunidade' && dados.pode?.oportunidade ? 'oportunidades' : 'pedidos'; desenhar(); }
  } catch (e) { recibo('recusado', 'Não foi registrado: ' + motivo(e)); if (b) b.disabled = false; }
}
async function baixar(emissao, nome, botao) {
  botao.disabled = true;
  try {
    const b64 = String(await IMTS.chamar('ext.documento_pdf', { p_emissao: Number(emissao) }) || '').replace(/\s+/g, '');
    if (!b64) throw new Error('o PDF deste documento ainda não foi gerado');
    const bin = atob(b64), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    const a = document.createElement('a'); a.href = url; a.download = (nome || 'documento').replace(/[\\/:*?"<>|]+/g, ' ').slice(0, 120) + '.pdf';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000);
    recibo('feito', 'Documento baixado.');
  } catch (e) { recibo('recusado', 'Não baixou: ' + motivo(e)); }
  finally { botao.disabled = false; }
}

async function carregar() {
  const parceiro = quem.contraparte?.tipo === 'parceiro';
  const [d, p, r, n] = await Promise.all([
    IMTS.chamar('ext.portal', {}),
    parceiro ? IMTS.chamar('ext.portal_parceiro', {}) : Promise.resolve(null),
    IMTS.chamar('ext.portal_reunioes', {}),
    // notas de débito: se falhar, só a aba delas mostra o motivo
    IMTS.chamar('ext.portal_notas_debito', {}).then(x => ({ ok: Array.isArray(x) ? x : [] }), e => ({ erro: motivo(e) }))
  ]);
  dados = d || {}; parc = p; reus = Array.isArray(r) ? r : []; notas = n.ok || null; notasErro = n.erro || null;
  desenhar();
}
async function falarSala(op, botao) {
  const t = $('sm-' + op).value.trim(); if (!t) { recibo('recusado', 'Escreva a mensagem.'); return; }
  botao.disabled = true;
  try { await IMTS.chamar('ext.sala_enviar', { p_oportunidade: Number(op), p_texto: t }); recibo('feito', 'Mensagem enviada à equipe.'); await carregar(); }
  catch (e) { recibo('recusado', 'Não enviou: ' + motivo(e)); botao.disabled = false; }
}
async function confirmar(id, botao) {
  botao.disabled = true; const n = $('av-' + id).value;
  try { await IMTS.chamar('ext.atendimento_confirmar', { p_pedido: Number(id), p_avaliacao: n ? Number(n) : null, p_comentario: null }); recibo('feito', 'Encerramento confirmado.'); await carregar(); }
  catch (e) { recibo('recusado', 'Não confirmou: ' + motivo(e)); botao.disabled = false; }
}
function abrirReabrir(id) {
  const p = (dados.pedidos || []).find(x => String(x.id) === String(id)); if (!p) return;
  abrirPainel(`<div class="topo"><h2 id="p-titulo">Reabrir o atendimento</h2><button class="btn" type="button" id="p-fechar">Fechar</button></div>
    <p>${esc(p.assunto)} · nº ${esc(p.id)}. Diga o que faltou; a equipe recebe de novo com prazo.</p>
    <form id="f-re" style="display:flex;flex-direction:column;gap:12px"><label class="campo" for="f-rem">O que faltou<textarea id="f-rem" maxlength="2000" required></textarea></label>
      <div class="acoes"><button class="btn perigo" type="submit">Reabrir</button><button class="btn" type="button" id="p-cancelar">Cancelar</button></div></form>`);
  $('f-re').onsubmit = async ev => { ev.preventDefault(); const b = ev.target.querySelector('button[type="submit"]'); b.disabled = true;
    try { await IMTS.chamar('ext.atendimento_reabrir', { p_pedido: Number(id), p_motivo: $('f-rem').value.trim() }); recibo('feito', 'Atendimento reaberto.'); fechar(); await carregar(); }
    catch (e) { recibo('recusado', 'Não reabriu: ' + motivo(e)); b.disabled = false; } };
}
async function consentir(id, botao) {
  botao.disabled = true;
  try { await IMTS.chamar('ext.reuniao_consentir_externo', { p_reuniao: Number(id) }); recibo('feito', 'Consentimento registrado.'); await carregar(); }
  catch (e) { recibo('recusado', 'Não registrou: ' + motivo(e)); botao.disabled = false; }
}
// ---------- Telegram ----------
function abrirTelegram() {
  const tg = parc?.telegram || dados.telegram;
  abrirPainel(`<div class="topo"><h2 id="p-titulo">Telegram</h2><button class="btn" type="button" id="p-fechar">Fechar</button></div>
    <p>${tg?.vinculado ? 'Este acesso está ligado a um Telegram desde ' + quando(tg.desde) + '.' : 'Ligue o seu Telegram para receber avisos e consultar ' + (parc ? 'comissões, oportunidades e a sala do negócio' : 'os seus pedidos') + ' pelo bot da IMTS.'}</p>
    <p>Nota fiscal, relatório e anexos continuam pelo portal: aqui o arquivo é lido, conferido e guardado.</p>
    <div id="tg-codigo" role="status"></div>
    <div class="acoes"><button class="btn prim" type="button" id="b-tg-gerar">${tg?.vinculado ? 'Ligar outro Telegram' : 'Gerar código'}</button>${tg?.vinculado ? '<button class="btn perigo" type="button" id="b-tg-desligar">Desligar</button>' : ''}</div>`);
  $('b-tg-gerar').onclick = async ev => { const b = ev.currentTarget; b.disabled = true;
    try { const r = await IMTS.chamar('ext.telegram_codigo', {});
      $('tg-codigo').innerHTML = `<div class="codigo">${esc(r.codigo)}</div><p>Envie ao bot: <span class="cod">/vincular ${esc(r.codigo)}</span>. Vale até ${quando(r.expira)} e serve uma vez.</p>`;
    } catch (e) { recibo('recusado', 'Não gerou: ' + motivo(e)); } finally { b.disabled = false; } };
  const d = $('b-tg-desligar'); if (d) d.onclick = async () => { d.disabled = true;
    try { await IMTS.chamar('ext.telegram_desligar', {}); recibo('feito', 'Telegram desligado.'); fechar(); await carregar(); }
    catch (e) { recibo('recusado', 'Não desligou: ' + motivo(e)); d.disabled = false; } };
}
// ---------- prestação de contas ----------
async function sha256(buf) { const h = await crypto.subtle.digest('SHA-256', buf); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }
function b64(buf) { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
const TEXTO_LEGIVEL = /^(text\/|application\/(xml|json))|\.(xml|txt|csv)$/i;
function abrirPrestacao() {
  const adq = (parc.carteira?.itens || []).filter(i => i.situacao === 'adquirida' && !i.prestacao);
  abrirPainel(`<div class="topo"><h2 id="p-titulo">Enviar prestação de contas</h2><button class="btn" type="button" id="p-fechar">Fechar</button></div>
    <p>A nota é lida e conferida na hora: CNPJ da sua organização, número que não se repete e valor igual à soma das comissões escolhidas. Conferida, segue para aprovação; quem aprova não registra o pagamento.</p>
    <form id="f-pr" style="display:flex;flex-direction:column;gap:12px">
      <label class="campo" for="f-prt">Tipo<select id="f-prt"><option value="nf">Nota fiscal de comissão</option><option value="relatorio">Relatório de prestação de contas</option></select></label>
      <fieldset class="campo" id="f-prc" style="border:0;padding:0;margin:0"><legend>Comissões que esta nota cobra</legend>
        <div class="escolha">${adq.length ? adq.map(i => `<label><input type="checkbox" value="${esc(i.id)}" checked> ${esc(i.cliente_final)} · parcela ${num(i.parcela)} · ${brl(i.valor)}</label>`).join('') : '<span class="sub">Nenhuma comissão adquirida livre.</span>'}</div></fieldset>
      <label class="campo" for="f-pra">Arquivo (XML da nota, PDF com texto ou texto)<input type="file" id="f-pra" required></label>
      <p id="f-prm" role="status"></p>
      <div class="acoes"><button class="btn prim" type="submit">Enviar e conferir</button><button class="btn" type="button" id="p-cancelar">Cancelar</button></div></form>`);
  $('f-prt').onchange = () => { $('f-prc').hidden = $('f-prt').value !== 'nf'; };
  $('f-pr').onsubmit = async ev => { ev.preventDefault();
    const b = ev.target.querySelector('button[type="submit"]'), f = $('f-pra').files[0], tipo = $('f-prt').value;
    const coms = tipo === 'nf' ? [...$('f-prc').querySelectorAll('input:checked')].map(x => Number(x.value)) : [];
    if (!f) { recibo('recusado', 'Escolha o arquivo.'); return; }
    b.disabled = true; b.textContent = 'Enviando…'; $('f-prm').textContent = '';
    const volta = () => { b.disabled = false; b.textContent = 'Enviar e conferir'; };
    let buf, h, pasta, up;
    try {
      buf = await f.arrayBuffer(); h = await sha256(buf);
      pasta = await IMTS.chamar('ext.pasta_externa', {});
    } catch (e) { recibo('recusado', 'Não enviou: ' + motivo(e)); volta(); return; }
    const mime = f.type || 'application/octet-stream';
    // 1. o arquivo vai para a pasta da empresa no Drive (07 parceiros, 08 clientes) pela função do servidor
    try { up = await IMTS.google('drive_enviar', { pasta: pasta.codigo, nome: f.name, mime, conteudo: b64(buf) }); if (!up?.id) throw new Error('o Drive não devolveu o identificador do arquivo'); }
    catch (e) {
      const m = 'O arquivo não foi guardado no Drive: ' + motivo(e) + '. Nada foi registrado; tente de novo mais tarde.';
      $('f-prm').textContent = m; recibo('recusado', m); volta(); return;
    }
    // 2. texto para a conferência: lido no navegador quando o arquivo é texto ou XML; senão, o que o servidor extrair
    let texto = '';
    try { if (TEXTO_LEGIVEL.test(mime) || TEXTO_LEGIVEL.test(f.name)) texto = (await f.text()).slice(0, 30000); else texto = String(up.texto || '').slice(0, 30000); } catch (e) { texto = ''; }
    // 3. registro com o id devolvido pelo Drive
    try {
      const r = await IMTS.chamar('ext.prestacao_enviar', { p_tipo: tipo, p_nome: f.name, p_hash: h, p_mime: mime, p_tamanho: f.size, p_texto: texto, p_comissoes: coms, p_drive_id: up.id, p_origem: 'portal' });
      recibo(r?.situacao === 'divergente' ? 'recusado' : 'feito', r?.situacao === 'conferida' ? 'Nota conferida; seguiu para aprovação.' : r?.situacao === 'divergente' ? 'A nota não conferiu: veja os pontos na lista.' : 'Relatório enviado para análise.');
      fechar(); aba = 'prestacao'; await carregar();
    } catch (e) { const m = 'O arquivo foi para o Drive, mas não foi registrado: ' + motivo(e); $('f-prm').textContent = m; recibo('recusado', m); volta(); }
  };
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.aba) { aba = t.dataset.aba; desenhar(); return; }
  if (!t.closest('#painel')) voltarFoco = t;
  if (t.id === 'b-novo') abrirNovo();
  else if (t.dataset.aceite) abrirAceite(t.dataset.aceite, t.dataset.t);
  else if (t.dataset.baixar) baixar(t.dataset.baixar, t.dataset.nome, t);
  else if (t.dataset.sala) falarSala(t.dataset.sala, t);
  else if (t.dataset.confirmar) confirmar(t.dataset.confirmar, t);
  else if (t.dataset.consentir) consentir(t.dataset.consentir, t);
  else if (t.dataset.reabrir) abrirReabrir(t.dataset.reabrir);
  else if (t.id === 'b-telegram') abrirTelegram();
  else if (t.id === 'b-prestar') abrirPrestacao();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('painel').hidden) { fechar(); return; }
  if (e.key === 'Tab' && !$('painel').hidden) {
    const fs = [...$('painel').querySelectorAll('button,input,select,textarea,summary')].filter(x => !x.disabled && !x.closest('[hidden]'));
    if (fs.length && e.shiftKey && document.activeElement === fs[0]) { e.preventDefault(); fs.at(-1).focus(); }
    else if (fs.length && !e.shiftKey && document.activeElement === fs.at(-1)) { e.preventDefault(); fs[0].focus(); }
  }
  const t = e.target.closest?.('.aba');
  if (t && ['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(e.key)) {
    const abas = [...document.querySelectorAll('.aba')].filter(x => !x.hidden), i = abas.indexOf(t);
    const j = e.key === 'Home' ? 0 : e.key === 'End' ? abas.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + abas.length) % abas.length;
    e.preventDefault(); aba = abas[j].dataset.aba; desenhar(); abas[j].focus();
  }
});

try { await carregar(); }
catch (e) { $('conteudo').innerHTML = `<p class="erro-carga" role="alert">O portal não carregou: ${esc(motivo(e))}.</p>`; }
})();
</script>
</body>
</html>
