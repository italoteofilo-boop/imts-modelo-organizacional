<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administração · IMTS.OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comum/base.css">
<style>
/* Layout: cabeçalho do módulo, resumo de saúde, abas por objeto, painel lateral de edição. */
:root { --pill:#1F201E; --pill-ink:#FFFFFF; --prim-ink:#FFFFFF; --shadow:0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.05);
  --mono:ui-monospace, 'SFMono-Regular', Menlo, monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --pill:#ECECE7; --pill-ink:#151614; --prim-ink:#10131C; --shadow:0 1px 2px rgba(0,0,0,.4); } }
:root[data-theme="dark"] { --pill:#ECECE7; --pill-ink:#151614; --prim-ink:#10131C; --shadow:0 1px 2px rgba(0,0,0,.4); }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.4; }
button, select, input, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.chao { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; padding:12px 20px; border-bottom:1px solid var(--hair); background:var(--surface); }
.marca { font-family:var(--serif); font-weight:600; font-size:22px; margin:0 auto 0 0; text-wrap:balance; }
.marca small { font-family:var(--sans); font-weight:400; font-size:13px; color:var(--sec); margin-left:6px; }
.icone { border:1px solid var(--hair); background:var(--surface); border-radius:8px; padding:5px 9px; font-size:13px; }
.icone:disabled { opacity:.5; cursor:wait; }
.resumo { display:flex; flex-wrap:wrap; gap:8px; padding:12px 20px 0; }
.resumo span { font-size:13px; padding:3px 10px; border-radius:99px; background:var(--surface); border:1px solid var(--hair); color:var(--sec); font-variant-numeric:tabular-nums; }
.resumo b { color:var(--ink); }
.resumo .mal b { color:var(--late); } .resumo .bem b { color:var(--ok); } .resumo .esp b { color:var(--wait); }
.abas { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px 20px; }
.aba { border:1px solid var(--hair); background:transparent; border-radius:99px; padding:6px 14px; font-size:14px; }
.aba[aria-selected="true"] { background:var(--pill); color:var(--pill-ink); border-color:var(--pill); }
.aba .n { font-size:12px; margin-left:4px; font-variant-numeric:tabular-nums; }
.busca { margin-left:auto; display:flex; align-items:center; gap:6px; }
.busca input { width:min(260px, 60vw); padding:6px 10px; border:1px solid var(--hair); border-radius:8px; background:var(--surface); }
main { padding:0 20px 24px; }
.grupo { margin:0 0 18px; }
.grupo h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--sec); margin:0 0 8px; font-weight:700; }
.grupo > p { margin:0 0 8px; }
.linhas { display:flex; flex-direction:column; gap:8px; }
.linha { display:grid; grid-template-columns:6px minmax(0, 2.2fr) minmax(0, 1.2fr) minmax(0, 1.6fr) auto; gap:12px; align-items:start; background:var(--surface);
  border:1px solid var(--hair); border-radius:12px; padding:10px 12px 10px 0; overflow:hidden; }
.faixa { align-self:stretch; border-radius:0 4px 4px 0; background:var(--hair); }
.faixa.ok { background:var(--ok); } .faixa.falha { background:var(--late); } .faixa.desconhecida { background:var(--hair); } .faixa.esp { background:var(--wait); }
.linha .t { font-weight:700; } .linha .sub, .sub { font-size:13px; color:var(--sec); overflow-wrap:anywhere; }
.linha code, .cod { font-family:var(--mono); font-size:12px; overflow-wrap:anywhere; }
.chips { display:flex; flex-wrap:wrap; gap:4px; }
.chip { font-size:12px; padding:1px 8px; border-radius:99px; background:var(--ground); color:var(--sec); white-space:nowrap; }
.chip.ativa, .chip.ok, .chip.aprovada { background:var(--ok-soft); color:var(--ok); }
.chip.pendente, .chip.esp { background:var(--wait-soft); color:var(--wait); }
.chip.falha, .chip.recusada, .chip.sensivel { background:var(--late-soft); color:var(--late); }
.chip.simulada, .chip.externo { background:var(--accent-soft); color:var(--accent); }
.valor { font-family:var(--mono); font-size:13px; background:var(--ground); padding:2px 6px; border-radius:6px; overflow-wrap:anywhere; }
.btn { border:1px solid var(--hair); background:var(--surface); border-radius:10px; padding:7px 13px; font-size:14px; }
.btn.prim { background:var(--accent); border-color:var(--accent); color:var(--prim-ink); }
.btn.perigo { border-color:var(--late); color:var(--late); }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.vazio { font-size:14px; color:var(--sec); padding:14px; background:var(--surface); border:1px dashed var(--hair); border-radius:12px; margin:0; }
table.hist { width:100%; border-collapse:collapse; font-size:13px; background:var(--surface); border:1px solid var(--hair); border-radius:12px; overflow:hidden; }
table.hist th, table.hist td { padding:7px 9px; border-bottom:1px solid var(--hair); text-align:left; vertical-align:top; }
table.hist th { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--sec); font-weight:700; background:var(--ground); }
.rolagem { overflow-x:auto; }
details > summary { padding:4px 0; min-height:24px; cursor:pointer; }
.foco { position:fixed; inset:0 0 0 auto; width:min(480px, 100%); background:var(--surface); border-left:1px solid var(--hair); box-shadow:-8px 0 24px rgba(0,0,0,.14);
  padding:18px 20px calc(18px + env(safe-area-inset-bottom, 0px)); overflow-y:auto; display:flex; flex-direction:column; gap:14px; z-index:5; }
.foco h2 { font-family:var(--serif); font-weight:600; font-size:22px; line-height:1.2; margin:0; text-wrap:balance; }
.foco .topo { display:flex; justify-content:space-between; gap:12px; align-items:start; }
.foco p { margin:0; font-size:14px; color:var(--sec); }
.campo { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--sec); }
.campo input, .campo select, .campo textarea { padding:8px 10px; border:1px solid var(--hair); border-radius:8px; background:var(--surface); color:var(--ink); font-size:14px; min-width:0; }
.campo textarea { min-height:84px; resize:vertical; }
.par { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.acoes { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.recibos { position:fixed; left:20px; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; gap:6px; z-index:6; max-width:min(420px, calc(100% - 40px)); }
.recibo { background:var(--surface); border:1px solid var(--hair); border-left:4px solid var(--accent); border-radius:10px; padding:8px 12px; font-size:13px; box-shadow:var(--shadow); }
.recibo.feito { border-left-color:var(--ok); } .recibo.recusado { border-left-color:var(--late); }
.rodape { padding:0 20px 28px; font-size:12px; color:var(--sec); max-width:80ch; }
.aviso { padding:10px 12px; border-radius:10px; background:var(--wait-soft); color:var(--wait); margin:0 20px 12px; }
.aviso.erro { background:var(--late-soft); color:var(--late); }
/* Integrações */
.aba[aria-pressed="true"] { background:var(--pill); color:var(--pill-ink); border-color:var(--pill); }
.passos { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.passo { display:grid; grid-template-columns:32px minmax(0,1fr); gap:12px; background:var(--surface); border:1px solid var(--hair); border-radius:12px; padding:12px 14px; }
.passo .num { width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-weight:700; }
.passo h4 { margin:2px 0 4px; font-size:15px; }
.passo p { margin:0 0 6px; overflow-wrap:anywhere; }
.passo a, .rodape a, .grupo a { color:var(--accent); }
.mini { display:flex; flex-direction:column; gap:8px; margin:8px 0 0; }
.oculto { -webkit-text-security:disc; font-family:var(--mono); min-height:84px; }
.conx { display:flex; flex-direction:column; gap:4px; }
.pares { border:1px solid var(--hair); border-radius:8px; padding:8px 10px; margin:0; display:flex; flex-direction:column; gap:8px; min-width:0; }
.pares legend { font-size:13px; color:var(--sec); padding:0 4px; }
.bom { color:var(--ok); } .ruim { color:var(--late); } .gravado { color:var(--ok); }
/* Cadastro */
.cartao { background:var(--surface); border:1px solid var(--hair); border-radius:12px; padding:14px 16px; }
.planilhas { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:10px; }
.planilha { display:flex; flex-direction:column; gap:8px; }
.planilha h3 { margin:0; font-size:15px; }
.planilha input[type=file] { max-width:100%; font-size:13px; }
.prev { margin-top:12px; display:flex; flex-direction:column; gap:10px; }
.prev ul { margin:0; padding-left:20px; font-size:14px; }
.prev .ruim li { color:var(--late); } .prev .atencao li { color:var(--wait); }
@media (max-width: 760px) {
  .linha { grid-template-columns:6px minmax(0, 1fr); }
  .linha > :not(.faixa) { grid-column:2; }
  .busca { margin-left:0; width:100%; } .busca input { width:100%; }
  .par { grid-template-columns:1fr; }
  .chao, .resumo, .abas, main, .rodape { padding-left:16px; padding-right:16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<header id="imts-barra"></header>
<div class="chao">
  <h1 class="marca">Administração<small>conexões, parâmetros, agentes, saúde e cadastro</small></h1>
  <button class="icone" id="b-verificar" type="button">Verificar saúde</button>
  <button class="icone" id="b-atual" type="button">Atualizar</button>
</div>
<p id="erro" class="aviso erro" hidden role="alert"></p>
<div class="resumo" id="resumo" aria-live="polite"></div>
<nav class="abas" aria-label="Objetos da administração"><div role="tablist" aria-label="Objetos da administração" style="display:contents">
  <button class="aba" role="tab" id="t-conexoes" data-aba="conexoes" aria-controls="conteudo" aria-selected="true" tabindex="0">Conexões<span class="n" id="n-conexoes"></span></button>
  <button class="aba" role="tab" id="t-integracoes" data-aba="integracoes" aria-controls="conteudo" aria-selected="false" tabindex="-1">Integrações<span class="n" id="n-integracoes"></span></button>
  <button class="aba" role="tab" id="t-parametros" data-aba="parametros" aria-controls="conteudo" aria-selected="false" tabindex="-1">Parâmetros<span class="n" id="n-parametros"></span></button>
  <button class="aba" role="tab" id="t-mudancas" data-aba="mudancas" aria-controls="conteudo" aria-selected="false" tabindex="-1">Aprovações<span class="n" id="n-mudancas"></span></button>
  <button class="aba" role="tab" id="t-agentes" data-aba="agentes" aria-controls="conteudo" aria-selected="false" tabindex="-1">Agentes<span class="n" id="n-agentes"></span></button>
  <button class="aba" role="tab" id="t-saude" data-aba="saude" aria-controls="conteudo" aria-selected="false" tabindex="-1">Saúde<span class="n" id="n-saude"></span></button>
  <button class="aba" role="tab" id="t-alertas" data-aba="alertas" aria-controls="conteudo" aria-selected="false" tabindex="-1">Alertas<span class="n" id="n-alertas"></span></button>
  <button class="aba" role="tab" id="t-implantacao" data-aba="implantacao" aria-controls="conteudo" aria-selected="false" tabindex="-1">Implantação<span class="n" id="n-implantacao"></span></button>
  <button class="aba" role="tab" id="t-cadastro" data-aba="cadastro" aria-controls="conteudo" aria-selected="false" tabindex="-1">Cadastro</button>
  <button class="aba" role="tab" id="t-historico" data-aba="historico" aria-controls="conteudo" aria-selected="false" tabindex="-1">Histórico<span class="n" id="n-historico"></span></button>
  <button class="aba" role="tab" id="t-agenda" data-aba="agenda" aria-controls="conteudo" aria-selected="false" tabindex="-1">Agenda</button>
  </div>
  <label class="busca" for="q"><span class="chip">Buscar</span><input id="q" type="search" placeholder="nome, chave, dono, segredo, pendência"></label>
</nav>
<main id="conteudo" role="tabpanel" tabindex="0" aria-labelledby="t-conexoes"><p class="vazio">Carregando…</p></main>
<p class="rodape" id="rodape"></p>
<aside class="foco" id="foco" hidden role="dialog" aria-modal="true" aria-labelledby="f-titulo"></aside>
<div class="recibos" id="recibos" aria-live="polite"></div>

<!-- Aba Cadastro: fica fora do redesenho das abas para não perder os arquivos escolhidos -->
<template id="modelo-cadastro">
  <section class="grupo"><h2>Importar o cadastro por planilha</h2>
    <p class="sub">Baixe os modelos, preencha no Excel ou no Google Planilhas e salve como CSV separado por ponto e vírgula. Escolha os arquivos que quiser carregar (nenhum é obrigatório), confira a prévia e só então confirme. A carga é tudo ou nada: com qualquer erro, nada é gravado. O que já existe fica como está.</p>
    <div class="planilhas" id="planilhas"></div>
    <div class="acoes" style="margin-top:12px">
      <button class="btn" type="button" id="b-previa">Conferir a prévia</button>
      <button class="btn prim" type="button" id="b-confirmar" disabled>Confirmar carga</button>
      <button class="btn" type="button" id="b-limpar">Limpar arquivos</button>
    </div>
    <div class="prev" id="previa" aria-live="polite"></div>
  </section>
  <section class="grupo"><h2>Convidar cliente ou parceiro</h2>
    <form class="cartao linhas" id="f-convite">
      <p class="sub" id="cv-empresa"></p>
      <div class="par"><label class="campo" for="cv-cp">Cliente ou parceiro<select id="cv-cp" required></select></label>
        <label class="campo" for="cv-perfil">Perfil<select id="cv-perfil"><option>gestor</option><option>fiscal</option><option>financeiro</option><option>operacional</option></select></label></div>
      <div class="par"><label class="campo" for="cv-nome">Nome<input id="cv-nome" required autocomplete="off"></label>
        <label class="campo" for="cv-email">E-mail<input id="cv-email" type="email" required autocomplete="off"></label></div>
      <div id="cv-pessoas" class="sub" aria-live="polite"></div>
      <div class="acoes"><button class="btn prim" type="submit">Convidar</button><span class="sub" id="cv-ok" role="status"></span></div>
    </form>
  </section>
</template>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="comum/imts.js"></script>
<script>
(async function () {
const $ = id => document.getElementById(id);
const esc = s => IMTS.esc(s);
const quando = t => t ? new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : 'nunca';
const ESTADO = { ativa: 'ativa', simulada: 'simulada', pendente: 'pendente', desligada: 'desligada' };
const SAUDE = { ok: 'saudável', falha: 'falha', desconhecida: 'sem verificação' };
const VAZIO = { resumo: {}, conexoes: [], parametros: [], mudancas: [], historico: [], agenda: [], administradores: [] };
let dados = VAZIO, agentes = null, alertas = null, implantacao = null, cobertura = null, falhas = {};
let aba = 'conexoes', voltarFoco = null, carregou = false;

const quem = await IMTS.iniciar({ exige: 'interno', modulo: 'admin', admin: true });

function motivo(e) { return e?.message || String(e || 'erro'); }
function recibo(tipo, texto) {
  const d = document.createElement('div'); d.className = 'recibo ' + tipo; d.textContent = texto; $('recibos').prepend(d);
  setTimeout(() => d.remove(), 7000);
}
const papel = id => (quem.pessoas || []).find(a => a.pessoa === id)?.nome || (dados.administradores || []).find(a => a.pessoa === id)?.papel
  || (id === quem.pessoa ? quem.nome : id ? String(id).slice(0, 8) : 'serviço');

function desenharResumo() {
  const r = dados.resumo || {}, f = r.fila_documentos || {};
  const filaTxt = Object.entries(f).map(([k, v]) => `${v} ${k.replace(/_/g, ' ')}`).join(', ') || 'vazia';
  const abertos = (alertas || []).filter(a => !a.resolvido_em).length;
  const faltam = (implantacao?.itens || []).filter(i => !i.ok).length;
  $('resumo').innerHTML = carregou ? `
    <span class="bem">Saudáveis <b>${Number(r.saude_ok || 0)}</b></span><span class="${r.saude_falha ? 'mal' : ''}">Com falha <b>${Number(r.saude_falha || 0)}</b></span>
    <span>Conexões <b>${Number(r.conexoes || 0)}</b> (${Number(r.ativas || 0)} ativas, ${Number(r.simuladas || 0)} simuladas, ${Number(r.pendentes || 0)} pendentes)</span>
    <span>Parâmetros <b>${Number(r.parametros || 0)}</b></span><span class="${r.mudancas_pendentes ? 'esp' : ''}">Aprovações pendentes <b>${Number(r.mudancas_pendentes || 0)}</b></span>
    <span>Fila de documentos <b>${esc(filaTxt)}</b></span>
    ${alertas ? `<span class="${abertos ? 'mal' : 'bem'}">Alertas abertos <b>${abertos}</b></span>` : ''}
    ${implantacao ? `<span class="${implantacao.pronto ? 'bem' : 'esp'}">Implantação <b>${implantacao.pronto ? 'pronta' : 'faltam ' + faltam}</b></span>` : ''}` : '';
  $('n-conexoes').textContent = r.conexoes ?? ''; $('n-parametros').textContent = r.parametros ?? '';
  $('n-mudancas').textContent = r.mudancas_pendentes || ''; $('n-historico').textContent = (dados.historico || []).length || '';
  $('n-agentes').textContent = (agentes || []).length || '';
  $('n-alertas').textContent = abertos || '';
  const ifal = (integ?.conexoes || []).filter(c => c.saude === 'falha').length; $('n-integracoes').textContent = ifal ? '!' + ifal : ''; $('n-implantacao').textContent = faltam ? '!' + faltam : '';
  const errs = (dados.saude?.erros || []).length + (dados.saude?.rotinas || []).filter(j => !j.ativo || j.falhas_24h).length;
  $('n-saude').textContent = errs ? '!' + errs : '';
  const rs = (agentes || []).reduce((n, a) => n + (a.rascunhos || []).length, 0);
  if (rs) $('resumo').insertAdjacentHTML('beforeend', `<span class="esp">Rascunhos de agente para aprovar <b>${rs}</b></span>`);
  if (errs) $('resumo').insertAdjacentHTML('beforeend', `<span class="mal">Alertas de saúde <b>${errs}</b></span>`);
}
const casa = (obj, q) => !q || JSON.stringify(obj).toLowerCase().includes(q);
const naoCarregou = chave => falhas[chave] ? `<p class="vazio">Não carregou: ${esc(falhas[chave])}.</p>` : '';

function vConexoes(q) {
  if (falhas.painel) return naoCarregou('painel');
  const grupos = {};
  for (const c of (dados.conexoes || []).filter(c => casa(c, q))) (grupos[c.categoria] ??= []).push(c);
  if (!Object.keys(grupos).length) return '<p class="vazio">Nenhuma conexão com esse termo.</p>';
  return Object.entries(grupos).map(([cat, cs]) => `<section class="grupo"><h2>${esc(cat)}</h2><div class="linhas">${cs.map(c => `
    <article class="linha"><span class="faixa ${esc(c.saude)}" aria-hidden="true"></span>
      <div><div class="t">${esc(c.nome)}</div><div class="sub"><code>${esc(c.codigo)}</code>${c.endpoint ? ' · ' + esc(c.endpoint) : ''}</div>
        ${c.pendencia ? `<div class="sub">Pendência: ${esc(c.pendencia)}</div>` : ''}</div>
      <div class="chips"><span class="chip ${esc(c.estado)}">${esc(ESTADO[c.estado] || c.estado)}</span><span class="chip ${esc(c.saude)}">${esc(SAUDE[c.saude] || c.saude)}</span><span class="chip">${esc(c.ambiente)}</span></div>
      <div class="sub">${c.saude_detalhe ? esc(c.saude_detalhe) + '<br>' : ''}Verificada: ${quando(c.verificada_em)}<br>Dono: ${esc(c.dono)}
        ${c.segredos?.length ? `<br>Segredos no cofre: ${c.segredos.map(s => `<code>${esc(s)}</code>`).join(', ')}` : ''}</div>
      <div><button class="btn" data-editar-conexao="${esc(c.codigo)}" type="button" aria-label="Editar ${esc(c.nome)}">Editar</button></div></article>`).join('')}</div></section>`).join('');
}
const mostra = (p, v) => p.tipo === 'faixa' ? `${v?.min} a ${v?.max} min` : p.tipo === 'lista' ? (v || []).join(' · ') : String(v);
function vParametros(q) {
  if (falhas.painel) return naoCarregou('painel');
  const grupos = {};
  for (const p of (dados.parametros || []).filter(p => casa(p, q))) (grupos[p.escopo] ??= []).push(p);
  if (!Object.keys(grupos).length) return '<p class="vazio">Nenhum parâmetro com esse termo.</p>';
  return Object.entries(grupos).map(([escopo, ps]) => `<section class="grupo"><h2>${esc(escopo)}</h2><div class="linhas">${ps.map(p => {
    const mudou = JSON.stringify(p.valor) !== JSON.stringify(p.padrao);
    return `<article class="linha"><span class="faixa ${mudou ? 'ok' : ''}" aria-hidden="true"></span>
      <div><div class="t">${esc(p.descricao)}</div><div class="sub"><code>${esc(p.chave)}</code></div></div>

const MODELOS = {
  empresas: { titulo: 'Empresas do IMTS', campos: ['nome', 'cnpj', 'razao_social', 'regime_tributario', 'porte', 'marca'] },
  pessoas: { titulo: 'Pessoas da equipe', campos: ['nome', 'email', 'papel', 'circulo', 'nivel', 'empresa'] },

  contratos_parceria: { titulo: 'Contratos de parceria', campos: ['parceiro', 'percentual', 'parcelas_max', 'vigente_de', 'fonte'] }
};
const cad = { arquivos: {}, previa: null, enviado: null };

function lerCSV(texto) {
  texto = texto.replace(/^﻿/, '');
  const linhas = []; let campo = '', linha = [], aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (aspas) { if (c === '"') { if (texto[i + 1] === '"') { campo += '"'; i++; } else aspas = false; } else campo += c; continue; }
    if (c === '"') aspas = true;
    else if (c === ';') { linha.push(campo); campo = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && texto[i + 1] === '\n') i++; linha.push(campo); linhas.push(linha); linha = []; campo = ''; }
    else campo += c;
  }
  if (campo !== '' || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas.filter(l => l.some(x => x.trim() !== ''));
}
const BOOL = { sim: true, s: true, true: true, verdadeiro: true, '1': true, x: true, 'não': false, nao: false, n: false, false: false, falso: false, '0': false };
function converter(aba, lin, i, erros) {
  const o = {};
  for (const [k, v0] of Object.entries(lin)) {
    const v = v0.trim(); if (v === '') continue;
    if (k === 'setor_publico') { const b = BOOL[v.toLowerCase()]; if (b === undefined) erros.push({ aba, linha: i, campo: k, motivo: 'use sim ou não' }); else o[k] = b; }
    else if (k === 'percentual') { const n = Number(v.replace('%', '').replace(/\./g, '').replace(',', '.')); if (!isFinite(n)) erros.push({ aba, linha: i, campo: k, motivo: 'número (ex.: 12,5)' }); else o[k] = n; }
    else if (k === 'parcelas_max') { if (!/^\d+$/.test(v)) erros.push({ aba, linha: i, campo: k, motivo: 'número inteiro' }); else o[k] = Number(v); }
    else if (k === 'vigente_de') {
      const m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/), iso = /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : null;
      if (!iso || isNaN(new Date(iso + 'T12:00:00'))) erros.push({ aba, linha: i, campo: k, motivo: 'data dd/mm/aaaa' }); else o[k] = iso;
    } else o[k] = v;
  }
  return o;
}
async function lerArquivo(aba, arquivo) {
  const st = $('st-' + aba);
  if (!arquivo) { delete cad.arquivos[aba]; st.textContent = 'Nenhum arquivo escolhido.'; invalidar(); return; }
  try {
    const linhas = lerCSV(await arquivo.text());
    if (!linhas.length) throw new Error('arquivo vazio');
    const cab = linhas[0].map(h => h.trim().toLowerCase());
    const esperado = MODELOS[aba].campos, faltam = esperado.filter(c => !cab.includes(c)), sobram = cab.filter(c => c && !esperado.includes(c));
    if (faltam.length) throw new Error('cabeçalho sem ' + faltam.join(', ') + '. Use o modelo desta planilha');
    const erros = [];
    const regs = linhas.slice(1).map((l, i) => converter(aba, Object.fromEntries(esperado.map(c => [c, l[cab.indexOf(c)] ?? ''])), i + 1, erros));
    cad.arquivos[aba] = { nome: arquivo.name, linhas: regs, erros };
    st.textContent = `${arquivo.name}: ${regs.length} ${regs.length === 1 ? 'linha' : 'linhas'}` + (sobram.length ? `; colunas ignoradas: ${sobram.join(', ')}` : '') + '.';
  } catch (e) {
    cad.arquivos[aba] = { nome: arquivo.name, linhas: [], erros: [{ aba, linha: 0, campo: 'arquivo', motivo: motivo(e) }] };
    st.textContent = `${arquivo.name}: não foi possível ler (${motivo(e)}).`;
  }
  invalidar();
}

async function confirmar() {

async function enviarSegredo(f) {
  const nome = f.dataset.segredoForm, campo = f.querySelector('input[type=password],textarea'), mot = f.querySelector('input:not([type=password])');
  const st = f.querySelector('[data-segredo-st]'), b = f.querySelector('button[type=submit]');
  let valor = campo.value;
  if (f.dataset.json) {
    let j = null; try { j = JSON.parse(valor); } catch (e) { /* trata abaixo */ }
    if (!j || typeof j !== 'object') { st.textContent = 'Não é um JSON válido. Cole o conteúdo inteiro do arquivo.'; return; }
    if (!j.client_email || !j.private_key) { st.textContent = 'O JSON precisa ter client_email e private_key (é o arquivo da conta de serviço?).'; return; }
    valor = JSON.stringify(j);
  } else valor = valor.trim();
  b.disabled = true;
  try {
    const r = await IMTS.chamar('adm.segredo_gravar', { p_nome: nome, p_valor: valor, p_motivo: mot.value });
    impressoes[nome] = r.impressao; campo.value = ''; valor = null;
    recibo('feito', `Segredo ${nome} gravado no cofre.`);
    await recarregar();
  } catch (e) { campo.value = ''; st.textContent = 'Recusado: ' + motivo(e); recibo('recusado', 'Segredo recusado: ' + motivo(e)); }
  finally { b.disabled = false; }

    IMTS.chamar('adm.conferir_implantacao', {}), IMTS.chamar('adm.cobertura_papeis', {}), IMTS.chamar('adm.integracoes', {})]);
  falhas = {};

  if (a.status === 'fulfilled') agentes = a.value || []; else falhas.agentes = motivo(a.reason);
  if (al.status === 'fulfilled') alertas = al.value || []; else falhas.alertas = motivo(al.reason);
  if (im.status === 'fulfilled') implantacao = im.value; else falhas.implantacao = motivo(im.reason);
  if (co.status === 'fulfilled') cobertura = co.value; else falhas.cobertura = motivo(co.reason);
  if (ig.status === 'fulfilled') integ = ig.value; else falhas.integ = motivo(ig.reason);
  carregou = true;
  const msgs = Object.values(falhas);
  $('erro').hidden = !msgs.length; $('erro').textContent = msgs.length ? 'Parte da administração não carregou: ' + [...new Set(msgs)].join('; ') : '';
  desenhar();
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.aba) { aba = t.dataset.aba; desenhar(); return; }
  if (!t.closest('#foco')) voltarFoco = t;
  if (t.dataset.ligar) abrirAgente('ligar', t.dataset.ligar, t.dataset.v);
  else if (t.dataset.liberar) abrirAgente('liberar', t.dataset.liberar, t.dataset.v);
  else if (t.dataset.memoria) abrirMemoria(Number(t.dataset.memoria), t.dataset.agente);
  else if (t.dataset.rascunho) aprovarRascunho(t.dataset.rascunho, t);
  else if (t.dataset.resolver) resolverAlerta(t.dataset.resolver, t);
  else if (t.dataset.editarConexao) abrirConexao(t.dataset.editarConexao);
  else if (t.dataset.editarParam) abrirParam(t.dataset.editarParam);
  else if (t.dataset.decidir) abrirDecisao(Number(t.dataset.decidir), t.dataset.d);
  else if (t.dataset.modelo) baixarModelo(t.dataset.modelo);
  else if (t.dataset.assist) { assist = t.dataset.assist; desenhar(); document.querySelector(`[data-assist="${assist}"]`)?.focus(); }
  else if (t.dataset.testar) testar(t.dataset.testar, t);
  else if (t.dataset.configurar) abrirConfigurar(t.dataset.configurar);
  else if (t.hasAttribute('data-telegram-ligar')) ligarTelegram(t);
  else if (t.dataset.parMais) $(t.dataset.parMais).insertAdjacentHTML('beforeend', linhaPar(nPar++));
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('foco').hidden) { fechar(); return; }
  if (e.key === 'Tab' && !$('foco').hidden) {   // foco preso no painel de edição enquanto ele está aberto
    const fs = [...$('foco').querySelectorAll('button,input,select,textarea,summary')].filter(x => !x.disabled);
    if (fs.length && e.shiftKey && document.activeElement === fs[0]) { e.preventDefault(); fs.at(-1).focus(); }
    else if (fs.length && !e.shiftKey && document.activeElement === fs.at(-1)) { e.preventDefault(); fs[0].focus(); }
  }
  const t = e.target.closest?.('.aba[role=tab]');   // setas e Home/End entre as abas
  if (t && ['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(e.key)) {
    const abas = [...document.querySelectorAll('.aba[role=tab]')], i = abas.indexOf(t);
    const j = e.key === 'Home' ? 0 : e.key === 'End' ? abas.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + abas.length) % abas.length;
    e.preventDefault(); aba = abas[j].dataset.aba; desenhar(); abas[j].focus();
  }
});
$('q').oninput = () => { if (aba !== 'cadastro') desenhar(); };
$('b-atual').onclick = async () => { const b = $('b-atual'); b.disabled = true; try { await recarregar(); recibo('feito', 'Atualizado.'); } catch (e) { recibo('recusado', 'Não atualizou: ' + motivo(e)); } finally { b.disabled = false; } };
$('b-verificar').onclick = async () => {
  const b = $('b-verificar'); b.disabled = true;
  try { const r = await IMTS.chamar('adm.verificar_saude', {}); recibo('feito', `Verificação: ${Number(r.ok)} saudáveis, ${Number(r.falha)} com falha; ${Number(r.http_disparadas)} chamadas HTTP disparadas (o resultado chega na próxima verificação).`); await recarregar(); }
  catch (e) { recibo('recusado', 'Verificação recusada: ' + motivo(e)); } finally { b.disabled = false; }
};
document.addEventListener('imts:empresa', () => { carregarContrapartes(); });

desenhar();
await recarregar();
carregarContrapartes();
})();
</script>
</body>
